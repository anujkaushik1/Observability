# Jaeger v2 config: receives traces over OTLP and keeps them in memory.
# Trimmed down from the official all-in-one example (cmd/jaeger/config.yaml).
# Runs on Jaeger v2.20.0: v2.21+ removed the old /api/traces search that Grafana's Jaeger plugin still uses.
# In-memory storage: traces are lost when Jaeger stops.

service:
  extensions: [jaeger_storage, jaeger_query, healthcheckv2]
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [jaeger_storage_exporter]
  telemetry:
    resource:
      service.name: jaeger
    metrics: # Jaeger's own metrics, at http://localhost:8888/metrics
      level: basic
      readers:
        - pull:
            exporter:
              prometheus:
                host: 127.0.0.1
                port: 8888
    logs:
      level: info

extensions:
  healthcheckv2:
    use_v2: true
    http:
      endpoint: 127.0.0.1:13133

  jaeger_query:
    storage:
      traces: memstore
    http:
      endpoint: 127.0.0.1:16686 # the Jaeger UI
    grpc:
      endpoint: 127.0.0.1:16685

  jaeger_storage:
    backends:
      memstore:
        memory:
          max_traces: 100000

receivers:
  otlp: # OpenTelemetry protocol: where the services will send traces later
    protocols:
      grpc:
        endpoint: 127.0.0.1:4317
      http:
        endpoint: 127.0.0.1:4318

processors:
  batch:

exporters:
  jaeger_storage_exporter:
    trace_storage: memstore
